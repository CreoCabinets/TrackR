<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17324d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2317324d'/%3E%3Cpath d='M13 17h25v8h-8v22h-9V25h-8zm29 0h9v30h-9z' fill='white'/%3E%3C/svg%3E">
  <title>Change password | TrackR</title>
  <style>
    :root{--ink:#142235;--brand:#17324d;--brand-strong:#0f2438;--accent:#0f766e;--muted:#68778a;--line:#d9e3e9;--bg:#f3f6f8;--danger:#a32626}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,rgba(15,118,110,.12),transparent 30rem),radial-gradient(circle at 90% 85%,rgba(23,50,77,.10),transparent 34rem),linear-gradient(180deg,#f7f9fa,var(--bg));color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .shell{width:min(500px,100%);background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:0 2px 5px rgba(20,34,53,.04),0 24px 64px rgba(20,34,53,.12)}
    .brand{display:flex;align-items:center;gap:14px;margin-bottom:24px}.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,var(--brand),#245b69);color:#fff;font-weight:900;font-size:14px;box-shadow:0 10px 22px rgba(23,50,77,.22)}
    .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:850;margin-bottom:3px}h1{margin:0;font-size:28px;line-height:1.08;letter-spacing:-.04em;color:var(--brand-strong)}p{margin:7px 0 0;color:var(--muted);font-weight:600;line-height:1.5}
    form{display:grid;gap:16px;margin-top:24px}label{display:grid;gap:7px;font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.07em;color:#5f7084}input{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px 14px;font:inherit;color:var(--ink);background:#fff;outline:none}input:focus{border-color:#7aa7a2;box-shadow:0 0 0 3px rgba(15,118,110,.11)}button{border:1px solid var(--brand);border-radius:10px;padding:13px 16px;background:var(--brand);color:#fff;font:inherit;font-weight:850;cursor:pointer}button:hover{background:var(--brand-strong)}.error{margin-top:17px;padding:11px 13px;border:1px solid #edc1c1;border-radius:10px;background:#fff5f5;color:var(--danger);font-weight:750}.help{margin-top:18px;padding-top:16px;border-top:1px solid #e4eaee;font-size:12px;color:var(--muted);line-height:1.55}
    @media(max-width:520px){body{padding:14px}.shell{padding:25px 21px;border-radius:16px}}
  </style>
</head>
<body>
  <section class="shell">
    <div class="brand"><span class="logo">TR</span><div><div class="eyebrow">Account security</div><h1>Change your password</h1><p>Signed in as {{ current_user.username }}.</p></div></div>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Current password<input name="current_password" type="password" maxlength="200" autocomplete="current-password" required></label>
      <label>New password<input name="new_password" type="password" minlength="12" maxlength="200" autocomplete="new-password" required></label>
      <label>Confirm new password<input name="confirm_password" type="password" minlength="12" maxlength="200" autocomplete="new-password" required></label>
      <button type="submit">Save new password</button>
    </form>
    <div class="help">Use at least 12 characters. Changing the password signs out any other browser sessions for this account.</div>
  </section>
</body>
</html>
