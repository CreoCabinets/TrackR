<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17324d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2317324d'/%3E%3Cpath d='M13 17h25v8h-8v22h-9V25h-8zm29 0h9v30h-9z' fill='white'/%3E%3C/svg%3E">
  <title>Sign in | TrackR</title>
  <style>
    :root{--ink:#142235;--brand:#17324d;--brand-strong:#0f2438;--accent:#0f766e;--muted:#68778a;--line:#d9e3e9;--bg:#f3f6f8;--danger:#a32626}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,rgba(15,118,110,.12),transparent 30rem),radial-gradient(circle at 90% 85%,rgba(23,50,77,.10),transparent 34rem),linear-gradient(180deg,#f7f9fa,var(--bg));color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .login-shell{width:min(470px,100%);background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:0 2px 5px rgba(20,34,53,.04),0 24px 64px rgba(20,34,53,.12);backdrop-filter:blur(16px)}
    .brand{display:flex;align-items:center;gap:14px;margin-bottom:28px}
    .logo{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,var(--brand),#245b69);color:#fff;font-weight:900;font-size:14px;letter-spacing:-.04em;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 22px rgba(23,50,77,.22)}
    .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:850;margin-bottom:3px}
    h1{margin:0;font-size:30px;line-height:1.05;letter-spacing:-.045em;color:var(--brand-strong)}
    p{margin:7px 0 0;color:var(--muted);font-weight:600;line-height:1.5}
    form{display:grid;gap:17px;margin-top:26px}
    label{display:grid;gap:7px;font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.07em;color:#5f7084}
    input{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px 14px;font:inherit;color:var(--ink);background:#fff;outline:none;box-shadow:inset 0 1px 2px rgba(20,34,53,.025);transition:border-color .15s ease,box-shadow .15s ease}
    input:focus{border-color:#7aa7a2;box-shadow:0 0 0 3px rgba(15,118,110,.11)}
    button{border:1px solid var(--brand);border-radius:10px;padding:13px 16px;background:var(--brand);color:#fff;font:inherit;font-weight:850;cursor:pointer;box-shadow:0 7px 18px rgba(23,50,77,.18);transition:.15s ease}
    button:hover{background:var(--brand-strong);border-color:var(--brand-strong);transform:translateY(-1px);box-shadow:0 10px 22px rgba(23,50,77,.22)}
    button:focus-visible,input:focus-visible{outline:3px solid rgba(15,118,110,.18);outline-offset:2px}
    .error{margin-top:18px;padding:11px 13px;border:1px solid #edc1c1;border-radius:10px;background:#fff5f5;color:var(--danger);font-weight:750}
    .help{margin-top:20px;padding-top:18px;border-top:1px solid #e4eaee;font-size:12px;color:var(--muted);line-height:1.55}
    .product-note{display:flex;align-items:center;gap:8px;margin-top:22px;color:#718095;font-size:12px;font-weight:650}.product-note:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(15,118,110,.10)}
    @media(max-width:520px){body{padding:14px}.login-shell{padding:25px 21px;border-radius:16px}.logo{width:44px;height:44px}h1{font-size:27px}}
  </style>
</head>
<body>
  <section class="login-shell">
    <div class="brand"><span class="logo">TR</span><div><div class="eyebrow">Production planning</div><h1>TrackR</h1><p>Sign in to access your workspace.</p></div></div>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Username<input name="username" value="{{ username }}" minlength="3" maxlength="32" autocapitalize="none" spellcheck="false" autocomplete="username" autofocus required></label>
      <label>Password<input name="password" type="password" maxlength="200" autocomplete="current-password" required></label>
      <button type="submit">Sign in</button>
    </form>
    <div class="help">Administrators can manage jobs, employees and settings. Standard users have read-only access to Home, Calendar and Schedule.</div>
    <div class="product-note">Production scheduling and capacity management</div>
  </section>
</body>
</html>
