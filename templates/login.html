<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17324d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2317324d'/%3E%3Cpath d='M13 17h25v8h-8v22h-9V25h-8zm29 0h9v30h-9z' fill='white'/%3E%3C/svg%3E">
  <title>Sign in | TrackR</title>
  <style>
    :root{--canvas:#f2f4f5;--surface:#fff;--text:#17212b;--muted:#65727e;--border:#d6dde1;--brand:#17324d;--brand-strong:#102b43;--active:#0f6f68;--problem:#b33a32;--problem-soft:#fcebe9}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--canvas);color:var(--text);font:14px/1.45 "Segoe UI Variable",Inter,"Segoe UI",system-ui,sans-serif}
    .login-shell{width:min(460px,100%);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;box-shadow:0 1px 2px rgba(16,33,47,.06)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:8px;background:var(--brand);color:#fff;font-weight:700;font-size:11px;letter-spacing:-.03em}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--active);font-weight:650;margin-bottom:2px}
    h1{margin:0;font-size:26px;line-height:1.1;letter-spacing:-.035em;color:var(--brand-strong);font-weight:700}p{margin:6px 0 0;color:var(--muted);font-weight:500}
    form{display:grid;gap:14px;margin-top:22px}label{display:grid;gap:6px;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.055em;color:var(--muted)}input{width:100%;height:38px;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font:inherit;color:var(--text);background:#fff;outline:none}input:focus{border-color:var(--active);box-shadow:0 0 0 3px rgba(15,111,104,.14)}
    button{height:38px;border:1px solid var(--brand);border-radius:6px;padding:8px 12px;background:var(--brand);color:#fff;font:inherit;font-weight:650;cursor:pointer}button:hover{background:var(--brand-strong);border-color:var(--brand-strong)}button:focus-visible,input:focus-visible{outline:3px solid rgba(15,111,104,.24);outline-offset:2px}
    .error{margin-top:16px;padding:10px 11px;border:1px solid #e7bcb8;border-radius:6px;background:var(--problem-soft);color:var(--problem);font-weight:600}.help{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);line-height:1.55}.product-note{display:flex;align-items:center;gap:7px;margin-top:18px;color:var(--muted);font-size:12px;font-weight:500}.product-note:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--active)}
    @media(max-width:520px){body{padding:14px}.login-shell{padding:22px 20px}.logo{width:36px;height:36px}h1{font-size:24px}}
  </style>
</head>
<body>
  <section class="login-shell">
    <div class="brand"><span class="logo">TR</span><div><div class="eyebrow">Production planning</div><h1>TrackR</h1><p>Sign in to access your workspace.</p></div></div>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Username<input name="username" value="{{ username }}" minlength="3" maxlength="32" autocapitalize="none" spellcheck="false" autocomplete="username" autofocus required></label>
      <label>Password<input name="password" type="password" maxlength="200" autocomplete="current-password" required></label>
      <button type="submit">Sign in</button>
    </form>
    <div class="help">Administrators can manage jobs, employees and settings. Standard users have read-only access to Home, Calendar and Schedule.</div>
    <div class="product-note">Production scheduling and capacity management</div>
  </section>
</body>
</html>
