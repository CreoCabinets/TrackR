[build]
builder = "RAILPACK"

[deploy]
startCommand = "gunicorn --workers 1 --threads 4 --timeout 120 --access-logfile - --error-logfile - --bind 0.0.0.0:$PORT app:app"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
drainingSeconds = 10
